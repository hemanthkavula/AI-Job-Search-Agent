name: Apply Alpaca Resume Standard

on:
  push:
    paths:
      - .github/apply-alpaca-resume-standard.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply permanent resume layout standard
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          renderer = Path('app/reference_resume_formatter.py')
          text = renderer.read_text()

          replacement = r'''def _set_right_tab(paragraph, position_twips=10728):
    """Use a single right-aligned tab stop for master-style title/date rows."""
    ppr = _paragraph_properties(paragraph)
    tabs = ppr.find(W + "tabs")
    if tabs is not None:
        ppr.remove(tabs)
    tabs = etree.SubElement(ppr, W + "tabs")
    tab = etree.SubElement(tabs, W + "tab")
    tab.set(W + "val", "right")
    tab.set(W + "pos", str(int(position_twips)))
    jc = ppr.find(W + "jc")
    if jc is None:
        jc = etree.SubElement(ppr, W + "jc")
    jc.set(W + "val", "left")
    spacing = ppr.find(W + "spacing")
    if spacing is None:
        spacing = etree.SubElement(ppr, W + "spacing")
    spacing.set(W + "before", "0")
    spacing.set(W + "after", "0")


def _tab(paragraph):
    run = etree.SubElement(paragraph, W + "r")
    etree.SubElement(run, W + "tab")


def _has_right_tab(paragraph):
    return bool(
        paragraph.xpath("./w:pPr/w:tabs/w:tab[@w:val='right']", namespaces=NS)
        and paragraph.xpath(".//w:tab", namespaces=NS)
    )


def _normalize_static_headers(root, master):
    """Apply the approved Alpaca/master layout to all static history rows.

    Employer line: Company | Location
    Next line:      Job Title                         Dates (right aligned)
    Education:      School | Location                Dates (right aligned)
    """
    for row in master["experience"]:
        paragraphs = _pt(root)
        company = row["company"]
        header_index = next(i for i, p in enumerate(paragraphs) if _text(p).startswith(company))
        header = paragraphs[header_index]
        company_style = _rpr(header, True) or _rpr(header, False)
        detail_style = _rpr(header, False) or company_style
        date_style = _date_rpr(header) or detail_style

        _compact_left_paragraph(header, after_twips=0)
        _clear(header)
        _run(header, company, company_style)
        _run(header, f" | {row['location']}", detail_style)

        paragraphs = _pt(root)
        header_index = next(i for i, p in enumerate(paragraphs) if _text(p) == f"{company} | {row['location']}")
        roles_index = next(
            i for i in range(header_index + 1, len(paragraphs))
            if _text(paragraphs[i]) == "Roles & Responsibilities:"
        )
        title = str(row.get("title") or "").strip()
        title_paragraph = next(
            p for p in paragraphs[header_index + 1:roles_index]
            if _text(p) == title
        )
        title_style = _rpr(title_paragraph, False) or _rpr(title_paragraph, True)
        _set_right_tab(title_paragraph)
        _clear(title_paragraph)
        _run(title_paragraph, title, title_style)
        _tab(title_paragraph)
        _run(title_paragraph, str(row.get("dates") or "").strip(), date_style)

    for row in master.get("education") or []:
        school = str(row.get("school") or "").strip()
        location = str(row.get("location") or "").strip()
        if not school:
            continue
        paragraph = next((p for p in _pt(root) if _text(p).startswith(school)), None)
        if paragraph is None:
            continue
        style = _rpr(paragraph, False) or _rpr(paragraph, True)
        date_style = _date_rpr(paragraph) or style
        start = str(row.get("start") or "").strip()
        end = str(row.get("end") or "").strip()
        dates = f"{start} – {end}" if start and end else (start or end)
        _set_right_tab(paragraph)
        _clear(paragraph)
        _run(paragraph, school, style)
        if location:
            _run(paragraph, f" | {location}", style)
        _tab(paragraph)
        _run(paragraph, dates, date_style)


def _is_employer_footer(value):'''

          text, count = re.subn(
              r'def _insert_compact_date_after\(.*?\n\ndef _is_employer_footer\(value\):',
              replacement,
              text,
              flags=re.S,
          )
          assert count == 1, count

          old_exp = '''        roles_index = next(
            (i for i in range((header_index or 0) + 1, len(output_paragraphs)) if _text(output_paragraphs[i]) == "Roles & Responsibilities:"),
            None,
        )
        date_found = False if header_index is None or roles_index is None else any(
            _text(p) == row.get("dates") for p in output_paragraphs[header_index + 1:roles_index]
        )
        if not date_found:
            reasons.append(row["company"] + "_dates")
'''
          new_exp = '''        roles_index = next(
            (i for i in range((header_index or 0) + 1, len(output_paragraphs)) if _text(output_paragraphs[i]) == "Roles & Responsibilities:"),
            None,
        )
        title_date = None if header_index is None or roles_index is None else next(
            (
                p for p in output_paragraphs[header_index + 1:roles_index]
                if _text(p) == f"{row.get('title', '')}{row.get('dates', '')}"
            ),
            None,
        )
        if title_date is None:
            reasons.append(row["company"] + "_title_date_text")
        elif not _has_right_tab(title_date):
            reasons.append(row["company"] + "_title_date_alignment")
'''
          assert old_exp in text
          text = text.replace(old_exp, new_exp)

          old_edu = '''        expected = f"{school} | {location}" if location else school
        school_index = next((i for i, p in enumerate(output_paragraphs) if _text(p).startswith(school)), None)
        paragraph = None if school_index is None else output_paragraphs[school_index]
        if paragraph is None or _text(paragraph) != expected:
            reasons.append("education_school_location_text")
        elif not _clean_header_layout(paragraph):
            reasons.append("education_school_location_spacing")
        start = str(row.get("start") or "").strip()
        end = str(row.get("end") or "").strip()
        dates = f"{start} – {end}" if start and end else (start or end)
        if dates and not any(_text(p) == dates for p in output_paragraphs[(school_index or 0) + 1:]):
            reasons.append("education_dates")
'''
          new_edu = '''        start = str(row.get("start") or "").strip()
        end = str(row.get("end") or "").strip()
        dates = f"{start} – {end}" if start and end else (start or end)
        school_location = f"{school} | {location}" if location else school
        expected = f"{school_location}{dates}"
        school_index = next((i for i, p in enumerate(output_paragraphs) if _text(p).startswith(school)), None)
        paragraph = None if school_index is None else output_paragraphs[school_index]
        if paragraph is None or _text(paragraph) != expected:
            reasons.append("education_school_location_date_text")
        elif not _has_right_tab(paragraph):
            reasons.append("education_date_alignment")
'''
          assert old_edu in text
          text = text.replace(old_edu, new_edu)
          renderer.write_text(text)

          writer = Path('app/llm_resume_writer.py')
          text = writer.read_text()
          text = text.replace(
              'section order, two summary paragraphs, Technical Skills rows, three employers, Roles & Responsibilities blocks, concise Skills lines, and education.',
              'section order, two summary paragraphs, Technical Skills rows, three employers, Roles & Responsibilities blocks, compact Environment technology-only lines, and education.',
          )
          text = text.replace(
              'Do not create Environment paragraphs. The renderer will display a compact Skills: line after each employer.',
              'Do not create prose Environment paragraphs. The renderer will display a compact Environment: technology-only line after each employer.',
          )
          text = text.replace('"employer_footer_is_skills_only": True,', '"employer_footer_is_environment_technology_only": True,')
          text = text.replace('"employer_footer_label": "Skills",', '"employer_footer_label": "Environment",')
          writer.write_text(text)

          tests = Path('tests/test_fresh_master_resume_contract.py')
          text = tests.read_text()
          text = text.replace('assert prompt["structure_contract"]["employer_footer_label"] == "Skills"', 'assert prompt["structure_contract"]["employer_footer_label"] == "Environment"')
          text = text.replace(
              '''    expected = {
        "Fidelity Investments": "Fidelity Investments | Jersey City, NJ",
        "Cigna Healthcare": "Cigna Healthcare | Bangalore, India",
        "Target Corporation": "Target Corporation | Bangalore, India",
        "Rowan University": "Rowan University | Glassboro, NJ",
    }''',
              '''    expected = {
        "Fidelity Investments": "Fidelity Investments | Jersey City, NJ",
        "Cigna Healthcare": "Cigna Healthcare | Bangalore, India",
        "Target Corporation": "Target Corporation | Bangalore, India",
    }''',
          )
          text, count = re.subn(
              r'def _assert_authoritative_dates\(doc\):.*?\n\ndef test_renderer_reproduces',
              '''def _assert_authoritative_dates(doc):
    expected = {
        "Fidelity Investments": ("Senior Data Engineer", "Jan 2025 – Present"),
        "Cigna Healthcare": ("Data Engineer", "Jan 2022 – Dec 2023"),
        "Target Corporation": ("Data Engineer", "Jan 2020 – Dec 2021"),
    }
    for company, (title, dates) in expected.items():
        company_index = next(i for i, p in enumerate(doc.paragraphs) if p.text.startswith(company))
        roles_index = next(i for i in range(company_index + 1, len(doc.paragraphs)) if doc.paragraphs[i].text == "Roles & Responsibilities:")
        row = next(p for p in doc.paragraphs[company_index + 1:roles_index] if title in p.text and dates in p.text)
        assert row.text == f"{title}\\t{dates}"
        assert '<w:tab' in row._p.xml
        assert 'w:val="right"' in row._p.xml

    education = next(p for p in doc.paragraphs if p.text.startswith("Rowan University"))
    assert education.text == "Rowan University | Glassboro, NJ\\tJan 2024 – Dec 2025"
    assert '<w:tab' in education._p.xml
    assert 'w:val="right"' in education._p.xml


def test_renderer_reproduces''',
              text,
              flags=re.S,
          )
          assert count == 1, count
          tests.write_text(text)

          quality = Path('tests/test_resume_nonblocking_quality.py')
          text = quality.read_text()
          text = text.replace('assert contract["employer_footer_label"] == "Skills"', 'assert contract["employer_footer_label"] == "Environment"')
          text = text.replace('Professional Experience Fidelity Investments Skills:', 'Professional Experience Fidelity Investments Environment:')
          text = text.replace('Cigna Healthcare Skills:', 'Cigna Healthcare Environment:')
          text = text.replace('Target Corporation Skills: Education', 'Target Corporation Environment: Education')
          quality.write_text(text)
          PY

          git diff --check
          git diff -- app/reference_resume_formatter.py app/llm_resume_writer.py tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py

      - name: Run resume regression tests
        run: |
          python -m pip install --quiet -r requirements.txt
          PYTHONPATH=. pytest -q tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py

      - name: Commit permanent standard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/reference_resume_formatter.py app/llm_resume_writer.py tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py
          git commit -m "Make Alpaca resume layout the production standard"
          git push origin HEAD:main
