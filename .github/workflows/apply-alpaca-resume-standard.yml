name: Apply Alpaca Resume Standard

on:
  push:
    paths:
      - .github/apply-alpaca-resume-standard.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply permanent standard
        run: python scripts/apply_alpaca_resume_standard.py

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run resume regression tests
        run: PYTHONPATH=. pytest -q tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py

      - name: Commit permanent standard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/reference_resume_formatter.py app/llm_resume_writer.py tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py
          git commit -m "Make Alpaca resume layout the production standard"
          git push origin HEAD:main
