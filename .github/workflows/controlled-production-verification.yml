name: Controlled Production Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/controlled-production-verification.yml"

concurrency:
  group: controlled-production-verification
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore production state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice for resume PDF validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      - name: Run controlled production cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-5.6
        run: python -m app.scheduled_runner --sources data/job_sources.json --force

      - name: Generate exhaustive source execution report
        run: |
          REPORT_PATH=$(python -m app.run_report)
          echo "Source report: $REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production acceptance invariants
        run: python -m app.production_acceptance

      - name: Sync application queue to hosted dashboard
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            tar -czf dashboard-sync.tgz generated/
            curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              -X POST \
              -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @dashboard-sync.tgz \
              "$DASHBOARD_SYNC_URL"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: controlled-production-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
