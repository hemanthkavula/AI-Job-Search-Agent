name: Source Validation

on:
  push:
    branches: [main]
    paths:
      - "app/sources/**"
      - "app/discovery.py"
      - "app/daily_runner.py"
      - "app/application_queue.py"
      - "app/batch_prepare.py"
      - "app/dashboard.py"
      - "app/job_ledger.py"
      - "app/production_cycle.py"
      - "app/jd_finalizer.py"
      - "app/source_registry.py"
      - "app/source_health.py"
      - "app/company_feeders.py"
      - "app/company_universe.py"
      - "app/company_domain_resolver.py"
      - "app/career_page_resolver.py"
      - "app/company_enrichment_runner.py"
      - "app/company_registry.py"
      - "data/job_sources.json"
      - "tests/**"
      - ".github/workflows/source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate source configuration JSON
        run: python -m json.tool data/job_sources.json >/dev/null
      - name: Run test suite
        run: python -m pytest -q
