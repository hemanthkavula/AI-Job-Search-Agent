name: Source Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate source configuration JSON
        run: python -m json.tool data/job_sources.json >/dev/null
      - name: Validate production requirements contract
        run: python -m app.production_preflight --strict --check-only
      - name: Run test suite
        run: python -m pytest -q
