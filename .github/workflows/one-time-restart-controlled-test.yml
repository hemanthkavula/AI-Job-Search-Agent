name: One-Time Restart Controlled Test

on:
  push:
    branches:
      - restart-controlled-test-after-discovery-fix
    paths:
      - .github/workflows/one-time-restart-controlled-test.yml

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: github.event.head_commit.message == 'Restart controlled test after discovery fix'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old stuck controlled run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/37159667346/cancel" || true

      - name: Dispatch fresh controlled production test
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/daily-discovery.yml/dispatches" \
            -d '{"ref":"main","inputs":{"force":"true","application_limit":"1"}}'
          echo "Dispatched optimized controlled production test with application_limit=1"
