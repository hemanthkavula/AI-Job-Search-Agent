name: Two-Hour Production Job Cycle
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the production cycle immediately for a controlled cloud test"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-job-cycle
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scheduler, ledger, discovery and source-health state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Decide whether a production slot is due
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path

          force = "${{ github.event_name }}" == "workflow_dispatch" and "${{ inputs.force }}" == "true"
          if force:
              print("Manual force run requested.")
              with open(Path("${{ github.output }}") if False else "/dev/null", "w") as _:
                  pass
          now = datetime.now(ZoneInfo("America/New_York"))
          state_path = Path("generated/scheduler_state.json")
          try:
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
          except Exception:
              state = {}

          due_slots = ((7, 30), (10, 0), (12, 30), (15, 30), (18, 30), (21, 0))
          # Keep the existing Cloudflare heartbeat architecture. Each requested
          # slot remains recoverable for 55 minutes, so repeated heartbeats can
          # recover a delayed/dropped dispatch without running the slot twice.
          now_minutes = now.hour * 60 + now.minute
          active_slot = None
          for hour, minute in due_slots:
              start = hour * 60 + minute
              if start <= now_minutes < start + 55:
                  active_slot = (hour, minute)
                  break
          slot_hour, slot_minute = active_slot if active_slot else (now.hour, now.minute)
          slot = f"{now.date().isoformat()}T{slot_hour:02d}:{slot_minute:02d}"
          due = (
              force
              or (
                  now.weekday() < 5
                  and active_slot is not None
                  and state.get("last_completed_slot") != slot
              )
          )
          output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with output.open("a") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
              f.write(f"slot={slot}\n")
          print(f"Eastern time: {now.isoformat()}")
          print(f"Slot: {slot}; last completed: {state.get('last_completed_slot')}; should_run={due}")
          PY

      - name: Stop heartbeat when no slot is due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "No production slot is due; heartbeat exits successfully."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Install LibreOffice for resume PDF validation
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      # Employer-universe enrichment is intentionally NOT part of this critical
      # production path. It performs thousands of external network probes and can
      # take far longer than a two-hour job slot. Run the dedicated
      # employer-universe-enrichment workflow independently; production consumes
      # the latest persisted company/source registry without waiting for enrichment.

      - name: Audit configured source health
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m app.source_health --sources data/job_sources.json --output state/source_health.json

      - name: Run scheduled production cycle
        if: steps.guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-5.6
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m app.scheduled_runner --sources data/job_sources.json --accepted-slot "${{ steps.guard.outputs.slot }}" $FORCE_ARG

      - name: Generate exhaustive source execution report
        if: steps.guard.outputs.should_run == 'true'
        run: |
          REPORT_PATH=$(python -m app.run_report)
          echo "Source report: $REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production acceptance invariants
        if: steps.guard.outputs.should_run == 'true'
        run: python -m app.production_acceptance

      - name: Sync application queue to hosted dashboard
        if: steps.guard.outputs.should_run == 'true'
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            # Build a dashboard-only payload. Large eligible/finalized discovery
            # reports remain in the GitHub cache/artifact and must never consume
            # the small Railway dashboard volume.
            rm -rf dashboard-sync
            mkdir -p dashboard-sync/generated/cycles

            if [ -f generated/job_ledger.json ]; then
              cp generated/job_ledger.json dashboard-sync/generated/job_ledger.json
            fi
            if [ -d generated/resumes ]; then
              cp -a generated/resumes dashboard-sync/generated/resumes
            fi
            if [ -d generated/cycles ]; then
              shopt -s nullglob
              for file in \
                generated/cycles/*_summary.json \
                generated/cycles/*_manifest.json \
                generated/cycles/*_application_queue.json; do
                cp "$file" dashboard-sync/generated/cycles/
              done
              shopt -u nullglob
            fi

            if [ ! -f dashboard-sync/generated/job_ledger.json ] && \
               [ ! -d dashboard-sync/generated/resumes ] && \
               [ -z "$(find dashboard-sync/generated/cycles -type f -print -quit)" ]; then
              echo "No dashboard state exists to sync."
            else
              tar -czf dashboard-sync.tgz -C dashboard-sync generated
              if ! curl --fail --show-error --silent --retry 3 --retry-delay 5 \
                -X POST \
                -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
                -H "Content-Type: application/gzip" \
                --data-binary @dashboard-sync.tgz \
                "$DASHBOARD_SYNC_URL"; then
                echo "::warning::Hosted dashboard sync failed after retries. Production discovery and resume processing completed successfully; dashboard publishing can recover on the next run."
              fi
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
