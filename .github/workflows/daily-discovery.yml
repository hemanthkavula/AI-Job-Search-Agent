name: Two-Hour Production Job Cycle
on:
  # Cloudflare remains the primary scheduler. These UTC schedules are a native
  # GitHub fallback so one missed external dispatch cannot drop a production
  # window. The Python guard below converts to America/New_York and only allows
  # the six requested ET slots, so the alternate EDT/EST heartbeat is a no-op.
  schedule:
    # 07:30, 12:30, 15:30 and 18:30 ET fallback heartbeats.
    - cron: "37 11,12,16,17,19,20,22,23 * * 1-5"
    # 10:00 ET fallback heartbeat.
    - cron: "7 14,15 * * 1-5"
    # 21:00 ET is already the next UTC day; Tue-Sat preserves Mon-Fri ET.
    - cron: "7 1,2 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the production cycle immediately for a controlled cloud test"
        required: false
        default: false
        type: boolean
      application_limit:
        description: "Manual runs only: maximum READY applications to attempt (0 = normal/unlimited)"
        required: false
        default: "0"
        type: string

concurrency:
  group: production-job-cycle
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scheduler, ledger, discovery and source-health state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Decide whether a production slot is due
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path

          force = "${{ github.event_name }}" == "workflow_dispatch" and "${{ inputs.force }}" == "true"
          if force:
              print("Manual force run requested.")
              with open(Path("${{ github.output }}") if False else "/dev/null", "w") as _:
                  pass
          now = datetime.now(ZoneInfo("America/New_York"))
          state_path = Path("generated/scheduler_state.json")
          try:
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
          except Exception:
              state = {}

          due_slots = ((7, 30), (10, 0), (12, 30), (15, 30), (18, 30), (21, 0))
          # Cloudflare sends repeated heartbeats during each 55-minute recovery
          # window. GitHub schedule events are an independent fallback. Both
          # paths share this same guard and last_completed_slot protection.
          now_minutes = now.hour * 60 + now.minute
          active_slot = None
          for hour, minute in due_slots:
              start = hour * 60 + minute
              if start <= now_minutes < start + 55:
                  active_slot = (hour, minute)
                  break
          slot_hour, slot_minute = active_slot if active_slot else (now.hour, now.minute)
          slot = f"{now.date().isoformat()}T{slot_hour:02d}:{slot_minute:02d}"
          due = (
              force
              or (
                  now.weekday() < 5
                  and active_slot is not None
                  and state.get("last_completed_slot") != slot
              )
          )
          output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with output.open("a") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
              f.write(f"slot={slot}\n")
          print(f"Eastern time: {now.isoformat()}")
          print(f"Slot: {slot}; last completed: {state.get('last_completed_slot')}; should_run={due}")
          PY

      - name: Stop heartbeat when no slot is due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "No production slot is due; heartbeat exits successfully."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Normalize state and verify production requirements
        if: steps.guard.outputs.should_run == 'true'
        run: python -m app.production_preflight --strict

      - name: Install LibreOffice for resume PDF validation
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      # Full regression tests run in source-validation when code changes. Source
      # health is a cached advisory input with its own TTL and is normalized by
      # production_preflight before discovery so persistent failures are actually
      # quarantined and periodically retried instead of being silently ignored.
      # Employer-universe enrichment remains a separate bounded workflow that runs
      # before the first production slot.

      - name: Run scheduled production cycle
        if: steps.guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-5.6
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m app.scheduled_runner --sources data/job_sources.json --accepted-slot "${{ steps.guard.outputs.slot }}" $FORCE_ARG

      - name: Generate exhaustive source execution report
        if: steps.guard.outputs.should_run == 'true'
        run: |
          REPORT_PATH=$(python -m app.run_report)
          echo "Source report: $REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production acceptance invariants
        if: steps.guard.outputs.should_run == 'true'
        run: python -m app.production_acceptance

      - name: Inspect ready application queue
        if: steps.guard.outputs.should_run == 'true'
        id: appqueue
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summaries=sorted(Path("generated/cycles").glob("*_summary.json"))
          count=0
          queue=""
          if summaries:
              summary=json.loads(summaries[-1].read_text(encoding="utf-8"))
              queue=str(summary.get("application_queue") or "")
              if queue and Path(queue).exists():
                  rows=json.loads(Path(queue).read_text(encoding="utf-8"))
                  count=sum(1 for row in rows if row.get("status")=="READY_FOR_ATS_ADAPTER")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"count={count}\n")
              f.write(f"queue={queue}\n")
          print(f"Ready application rows: {count}; queue={queue or 'none'}")
          PY

      - name: Install application browser runtime
        if: steps.guard.outputs.should_run == 'true' && steps.appqueue.outputs.count != '0'
        continue-on-error: true
        run: |
          pip install -r requirements-application.txt
          browser-use install

      - name: Run guarded automatic application stage
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APPLICATION_AGENT_MODEL: gpt-5.6-luna
          APPLICATION_AGENT_MAX_STEPS: "80"
          APPLICATION_AGENT_TIMEOUT_SECONDS: "600"
          APPLICATION_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.application_limit || '0' }}
          APPLICATION_QUEUE: ${{ steps.appqueue.outputs.queue }}
        shell: bash
        run: |
          APP_ARGS=(--submit)
          if [[ "${APPLICATION_LIMIT:-0}" =~ ^[1-9][0-9]*$ ]]; then
            TEST_QUEUE="generated/manual_application_queue.json"
            python - <<'PY'
          import json, os
          from pathlib import Path

          source = Path(os.environ["APPLICATION_QUEUE"])
          limit = int(os.environ["APPLICATION_LIMIT"])
          rows = json.loads(source.read_text(encoding="utf-8")) if source.exists() else []
          ready = [row for row in rows if row.get("status") == "READY_FOR_ATS_ADAPTER"][:limit]
          out = Path("generated/manual_application_queue.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(ready, indent=2), encoding="utf-8")
          print(f"Controlled manual application queue: {len(ready)} of requested limit {limit}")
          PY
            APP_ARGS+=(--queue "$TEST_QUEUE" --limit "$APPLICATION_LIMIT")
          fi
          python -m app.application_stage "${APP_ARGS[@]}"

      - name: Sync application queue to hosted dashboard
        if: steps.guard.outputs.should_run == 'true'
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            tar -czf dashboard-sync.tgz generated/
            curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              -X POST \
              -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @dashboard-sync.tgz \
              "$DASHBOARD_SYNC_URL"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
