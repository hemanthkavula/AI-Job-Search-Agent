name: Two-Hour Production Job Cycle
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the production cycle immediately for a controlled cloud test"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-job-cycle
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scheduler, ledger, discovery and source-health state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Decide whether a production slot is due
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path

          force = "${{ github.event_name }}" == "workflow_dispatch" and "${{ inputs.force }}" == "true"
          if force:
              print("Manual force run requested.")
              with open(Path("${{ github.output }}") if False else "/dev/null", "w") as _:
                  pass
          now = datetime.now(ZoneInfo("America/New_York"))
          state_path = Path("generated/scheduler_state.json")
          try:
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
          except Exception:
              state = {}

          due_hours = {7, 9, 11, 13, 15, 17, 19}
          # A slot stays recoverable for 55 minutes. The 5-minute off-peak heartbeat
          # therefore provides many independent chances if GitHub delays/drops one.
          slot = f"{now.date().isoformat()}T{now.hour:02d}:00"
          due = (
              force
              or (
                  now.weekday() < 5
                  and now.hour in due_hours
                  and now.minute < 55
                  and state.get("last_completed_slot") != slot
              )
          )
          output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with output.open("a") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
              f.write(f"slot={slot}\n")
          print(f"Eastern time: {now.isoformat()}")
          print(f"Slot: {slot}; last completed: {state.get('last_completed_slot')}; should_run={due}")
          PY

      - name: Stop heartbeat when no slot is due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "No production slot is due; heartbeat exits successfully."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install LibreOffice for resume PDF validation
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      - name: Run tests
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Enrich US employer universe and learn career sources
        if: steps.guard.outputs.should_run == 'true' && endsWith(steps.guard.outputs.slot, 'T07:00')
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          python -m app.company_enrichment_runner \
            --source-config data/job_sources.json \
            --domain-budget 250 \
            --career-budget 250 \
            --retry-days 7

      - name: Audit configured source health
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m app.source_health --sources data/job_sources.json --output state/source_health.json

      - name: Run scheduled production cycle
        if: steps.guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-5.6
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m app.scheduled_runner --sources data/job_sources.json $FORCE_ARG

      - name: Sync application queue to hosted dashboard
        if: steps.guard.outputs.should_run == 'true'
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            tar -czf dashboard-sync.tgz generated/
            curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              -X POST \
              -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @dashboard-sync.tgz \
              "$DASHBOARD_SYNC_URL"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
