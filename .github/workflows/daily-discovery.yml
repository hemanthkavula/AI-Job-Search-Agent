name: Hourly Fresh Job Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Restore seen-job state
        uses: actions/cache@v4
        with:
          path: generated/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-
      - name: Find jobs from last 24 hours
        run: python -m app.daily_runner --sources data/job_sources.json --min-score 65 --hours 24
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-job-results-${{ github.run_number }}
          path: |
            generated/daily_jobs.json
            generated/seen_jobs.json
