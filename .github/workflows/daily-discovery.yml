name: Hourly Production Job Cycle
on:
  push:
    branches: [main, feature/checkpoint-discovery-window]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Trigger hourly across the full ET/EDT envelope;
    # app.scheduled_runner is authoritative for Mon-Fri 07:00-18:59 America/New_York.
    - cron: "17 11-23 * * 1-5"
permissions:
  contents: read
jobs:
  production-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Restore scheduler and job-ledger state
        uses: actions/cache@v4
        with:
          path: |
            generated/scheduler_state.json
            generated/job_ledger.json
            generated/seen_jobs.json
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-
      - name: Run scheduled production cycle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m app.scheduled_runner --sources data/job_sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/cycles/
            generated/scheduler_state.json
            generated/job_ledger.json
            generated/seen_jobs.json
