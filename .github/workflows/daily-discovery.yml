name: Two-Hour Production Job Cycle
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the production cycle immediately for a controlled cloud test"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-job-cycle
  # A new scheduled slot must never queue behind a stale/hung cycle. Interrupted
  # source units keep their prior successful watermark and catch up next cycle.
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    # Leave headroom for reporting, dashboard sync and artifact persistence.
    # The production runner itself gets a smaller explicit budget below.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scheduler, ledger, discovery and source-health state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Restore latest learned employer and ATS registries
        uses: actions/cache/restore@v4
        with:
          path: |
            generated/company_registry.json
            generated/discovered_sources.json
          key: job-agent-enrichment-${{ github.run_id }}
          restore-keys: |
            job-agent-enrichment-

      - name: Decide whether a production slot is due
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os
          from pathlib import Path

          force = "${{ github.event_name }}" == "workflow_dispatch" and "${{ inputs.force }}" == "true"
          now = datetime.now(ZoneInfo("America/New_York"))
          state_path = Path("generated/scheduler_state.json")
          try:
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
          except Exception:
              state = {}

          due_slots = ((7, 30), (10, 0), (12, 30), (15, 30), (18, 30), (21, 0))
          now_minutes = now.hour * 60 + now.minute
          active_slot = None
          for hour, minute in due_slots:
              start = hour * 60 + minute
              if start <= now_minutes < start + 55:
                  active_slot = (hour, minute)
                  break
          slot_hour, slot_minute = active_slot if active_slot else (now.hour, now.minute)
          slot = f"{now.date().isoformat()}T{slot_hour:02d}:{slot_minute:02d}"
          due = force or (now.weekday() < 5 and active_slot is not None and state.get("last_completed_slot") != slot)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
              f.write(f"slot={slot}\n")
          print(f"Eastern time: {now.isoformat()}")
          print(f"Slot: {slot}; last completed: {state.get('last_completed_slot')}; should_run={due}")
          PY

      - name: Stop heartbeat when no slot is due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "No production slot is due; heartbeat exits successfully."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # LibreOffice installation previously consumed several minutes on every run
      # and competed with discovery for the 55-minute workflow cap. Resume PDF
      # conversion remains supported, but the runner must not spend the critical
      # discovery window installing OS packages. Use the master DOCX/PDF fallback
      # or a prebuilt runner image for conversion when soffice is unavailable.
      - name: Report PDF converter availability
        if: steps.guard.outputs.should_run == 'true'
        run: |
          if command -v soffice >/dev/null 2>&1; then
            soffice --version
          else
            echo "LibreOffice is not preinstalled; production will use configured PDF fallback/recovery rather than apt-installing it in this cycle."
          fi

      # Source-health probing is diagnostic, not a production prerequisite. Running
      # every probe serially before discovery reduces recall and can cause timeout.
      # Production collectors already retry configured tenants and record per-source
      # status. A dedicated validation workflow can run the exhaustive audit.

      - name: Run scheduled production cycle within a 45-minute execution budget
        if: steps.guard.outputs.should_run == 'true'
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOB_ANALYSIS_LLM_ENABLED: "true"
          JOB_ANALYSIS_LLM_MODEL: gpt-5.6-luna
          RESUME_LLM_MODEL: gpt-5.6
          # The runner uses per-provider/per-tenant watermarks. A source that times
          # out must keep its previous successful watermark so the next cycle catches
          # up instead of silently skipping jobs.
          PRODUCTION_RUNTIME_BUDGET_SECONDS: "2580"
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m app.scheduled_runner --sources data/job_sources.json --accepted-slot "${{ steps.guard.outputs.slot }}" $FORCE_ARG

      - name: Generate exhaustive source execution report
        if: steps.guard.outputs.should_run == 'true'
        run: |
          REPORT_PATH=$(python -m app.run_report)
          echo "Source report: $REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production acceptance invariants
        if: steps.guard.outputs.should_run == 'true'
        run: python -m app.production_acceptance

      - name: Sync application queue to hosted dashboard
        if: steps.guard.outputs.should_run == 'true'
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            tar -czf dashboard-sync.tgz generated/
            curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              --connect-timeout 10 --max-time 90 \
              -X POST \
              -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @dashboard-sync.tgz \
              "$DASHBOARD_SYNC_URL"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.should_run == 'true'
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
