name: One-Time Discovery Concurrency Patch

on:
  push:
    branches:
      - fix-discovery-head-of-line-blocking
    paths:
      - .github/workflows/one-time-patch-discovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-discovery-head-of-line-blocking

      - name: Patch discovery executor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/discovery.py')
          text = path.read_text(encoding='utf-8')

          old_pool = '    with ThreadPoolExecutor(max_workers=10) as pool:'
          new_pool = '''    # These calls are network-bound and spread across independent employer/ATS hosts.\n    # Use bounded higher concurrency so a large enriched source universe can finish\n    # inside a production slot without changing source coverage or eligibility.\n    with ThreadPoolExecutor(max_workers=32) as pool:'''
          if old_pool not in text:
              raise SystemExit('Expected executor declaration not found')
          text = text.replace(old_pool, new_pool, 1)

          old_loop = '''        for future,source,company in tasks:\n            key=f"{source}:{company or source}"\n            started=datetime.now(timezone.utc)\n            try:\n                result=future.result();jobs.extend(result)\n                health[key]={"source":source,"company":company,"status":"OK","jobs_returned":len(result),"checked_at":started.isoformat()}\n            except Exception as e:\n                err={"source":source,"company":company,"error":str(e)};errors.append(err)\n                health[key]={"source":source,"company":company,"status":"ERROR","jobs_returned":0,"error":str(e),"checked_at":started.isoformat()}\n'''
          new_loop = '''        # Consume completed network calls in completion order. Previously this loop\n        # called future.result() in submission order, so one slow early tenant could\n        # head-of-line block hundreds of already-completed sources.\n        task_meta={future:(source,company) for future,source,company in tasks}\n        for future in as_completed(task_meta):\n            source,company=task_meta[future]\n            key=f"{source}:{company or source}"\n            completed=datetime.now(timezone.utc)\n            try:\n                result=future.result();jobs.extend(result)\n                health[key]={"source":source,"company":company,"status":"OK","jobs_returned":len(result),"checked_at":completed.isoformat()}\n            except Exception as e:\n                err={"source":source,"company":company,"error":str(e)};errors.append(err)\n                health[key]={"source":source,"company":company,"status":"ERROR","jobs_returned":0,"error":str(e),"checked_at":completed.isoformat()}\n'''
          if old_loop not in text:
              raise SystemExit('Expected future collection loop not found')
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/one-time-patch-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/discovery.py .github/workflows/one-time-patch-discovery.yml
          git commit -m "Fix discovery head-of-line blocking"
          git push origin HEAD:fix-discovery-head-of-line-blocking
