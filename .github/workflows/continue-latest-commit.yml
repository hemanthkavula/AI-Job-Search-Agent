    out["description_complete"]=_looks_like_complete_jd(final,quality_source)
    out["description_usable"]=_looks_like_usable_jd(final,quality_source)
''')
          replace_between("app/jd_finalizer.py",
              '        if aggregator_origin and official_posted is None:\n',
              '        if official_posted is not None and (official_posted<cutoff or official_posted>check_now+timedelta(minutes=10)):\n',
