name: Continue Latest Commit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continue-latest-commit.yml"

permissions:
  contents: write

concurrency:
  group: continue-latest-commit
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply continuation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding="utf-8")
              count=text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1),encoding="utf-8")

          def replace_between(path, start_marker, end_marker, replacement):
              p=Path(path); text=p.read_text(encoding="utf-8")
              start=text.find(start_marker)
              if start < 0: raise RuntimeError(f"{path}: start marker not found: {start_marker!r}")
              end=text.find(end_marker,start)
              if end < 0: raise RuntimeError(f"{path}: end marker not found: {end_marker!r}")
              p.write_text(text[:start]+replacement+text[end:],encoding="utf-8")

          # 1) Experience policy: eligible minimum is 3 years; 7+ remains excluded.
          replace_once("data/candidate_profile.json", '"min_required_years": 4', '"min_required_years": 3')
          replace_once("app/eligibility.py", 'min_req=profile.get("preferences",{}).get("min_required_years",4)', 'min_req=profile.get("preferences",{}).get("min_required_years",3)')

          # 2) Company identity normalization: the old raw regexes were double-escaped,
          # so legal suffixes/whitespace were not actually normalized.
          replace_once("app/company_registry.py",
              r'''s=re.sub(r"\\b"+suffixes+r"\\b"," ",s)''',
              r'''s=re.sub(r"\b"+suffixes+r"\b"," ",s)''')
          replace_once("app/company_registry.py",
              r'''return re.sub(r"\\s+"," ",s).strip()''',
              r'''return re.sub(r"\s+"," ",s).strip()''')

          # 3) Learned, verified custom career sites must round-trip into production discovery.
          replace_once("app/source_registry.py",
              'def as_discovery_config(registry):\n out={k:[] for k in PATTERNS}\n',
              'def as_discovery_config(registry):\n out={k:[] for k in PATTERNS}\n out["career_site"]=[]\n')
          replace_once("app/source_registry.py",
              ' for x in registry.get("workday",[]):\n',
              ''' for x in registry.get("career_site",[]):
  url=x.get("search_url") or x.get("careers_url") or x.get("original_url") or x.get("url")
  if not url:continue
  out["career_site"].append({
   "company":x.get("company"),"search_url":url,
   "job_url_pattern":x.get("job_url_pattern") or r"(?:/jobs?/|/careers?/|/positions?/|/openings?/|jobId=|job_id=)"
  })
 for x in registry.get("workday",[]):
''')
          replace_once("app/discovery.py",
              '        merged[provider]=existing\n    config=merged\n',
              '''        merged[provider]=existing
    # Verified first-party career pages learned by employer enrichment are executable
    # production sources too. Previously they were persisted but never merged back
    # into discovery, so enrichment coverage did not translate into discovered jobs.
    existing_career=list(config.get("career_site",[]) or [])
    seen_career={(str(x.get("company") or "").strip().lower(),str(x.get("search_url") or x.get("careers_url") or "").rstrip("/").lower()) for x in existing_career}
    for row in learned_config.get("career_site",[]) or []:
        key=(str(row.get("company") or "").strip().lower(),str(row.get("search_url") or row.get("careers_url") or "").rstrip("/").lower())
        if key not in seen_career and key[1]:
            existing_career.append(row);seen_career.add(key)
    merged["career_site"]=existing_career
    config=merged
''')

          # Fix HTML text cleanup used by direct employer career pages.
