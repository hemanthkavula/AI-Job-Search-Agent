name: Continue Latest Commit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continue-latest-commit.yml"
      - "scripts/continue_latest_commit.py"
      - "scripts/run_continuation.py"

permissions:
  contents: write

concurrency:
  group: continue-latest-commit
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply continuation fixes
        run: python scripts/run_continuation.py

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression suite
        run: python -m pytest -q

      - name: Commit validated continuation
        shell: bash
        run: |
          rm -f .github/workflows/continue-latest-commit.yml scripts/continue_latest_commit.py scripts/run_continuation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Enforce employer-authoritative discovery and resume policy"
          git push origin HEAD:main
