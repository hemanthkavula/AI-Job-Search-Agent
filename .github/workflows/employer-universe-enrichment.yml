name: Employer Universe Enrichment
# Slow employer/ATS enrichment runs before the first production slot so fresh
# discovery consumes the latest verified employer/career-source registry without
# delaying the 07:30 ET job cycle.

on:
  schedule:
    # GitHub is the delayed fallback, not the primary clock. Run both DST
    # possibilities at :50; the local-time guard below allows only the 06:50 ET
    # heartbeat, and only when today's Cloudflare-triggered enrichment did not
    # already complete successfully. This is deliberately after the primary
    # workflow's 75-minute timeout window from its 05:30 ET start.
    - cron: "50 10 * * 1-5"
    - cron: "50 11 * * 1-5"
  workflow_dispatch:
    inputs:
      domain_budget:
        description: "Maximum evidence-backed domain resolutions per incremental batch"
        required: false
        default: "750"
        type: string
      career_budget:
        description: "Maximum official career/ATS resolutions per incremental batch"
        required: false
        default: "750"
        type: string
      ats_tenant_budget:
        description: "Maximum expensive ATS tenant probes per incremental batch"
        required: false
        default: "250"
        type: string
      deep_domain_search:
        description: "Use verified company-name discovery for identity-only employers"
        required: false
        default: true
        type: boolean
      scheduled_dispatch:
        description: "Internal: Cloudflare scheduler dispatch; normal manual runs should leave this false"
        required: false
        default: false
        type: boolean

concurrency:
  group: employer-universe-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore state before deciding whether the fallback is necessary. The
      # successful primary run writes employer_universe_last_success.json into
      # this shared cache, so the delayed fallback becomes a safe no-op.
      - name: Restore employer/source discovery state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-enrichment-${{ github.run_id }}
          restore-keys: |
            job-agent-state-

      - name: Decide whether enrichment is due
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json
          import os

          event = "${{ github.event_name }}"
          scheduled_dispatch = "${{ inputs.scheduled_dispatch }}" == "true"
          now = datetime.now(ZoneInfo("America/New_York"))

          already_succeeded_today = False
          marker_path = Path("state/employer_universe_last_success.json")
          if marker_path.exists():
              try:
                  marker = json.loads(marker_path.read_text(encoding="utf-8"))
                  completed = datetime.fromisoformat(
                      str(marker.get("completed_at") or "").replace("Z", "+00:00")
                  )
                  if completed.tzinfo is None:
                      completed = completed.replace(tzinfo=timezone.utc)
                  completed_et = completed.astimezone(ZoneInfo("America/New_York"))
                  already_succeeded_today = (
                      marker.get("status") == "SUCCESS"
                      and completed_et.date() == now.date()
                  )
              except Exception as exc:
                  print(f"Ignoring unreadable enrichment success marker: {exc}")

          # A user-triggered workflow_dispatch remains an explicit force run.
          # Cloudflare marks its automated dispatch so it participates in the
          # once-per-weekday idempotency guard instead of acting like a manual force.
          manual_force = event == "workflow_dispatch" and not scheduled_dispatch
          cloudflare_due = event == "workflow_dispatch" and scheduled_dispatch and now.weekday() < 5
          github_fallback_due = event == "schedule" and now.weekday() < 5 and now.hour == 6

          due = manual_force or (
              (cloudflare_due or github_fallback_due)
              and not already_succeeded_today
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
          print(
              f"Eastern time: {now.isoformat()}; event={event}; "
              f"scheduled_dispatch={scheduled_dispatch}; "
              f"already_succeeded_today={already_succeeded_today}; enrichment due={due}"
          )
          PY

      - name: Stop fallback or duplicate dispatch when enrichment is not due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "Employer/source enrichment is not due; exiting without production work."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run employer-universe enrichment only
        if: steps.guard.outputs.should_run == 'true'
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          DEEP_ARG="--deep-domain-search"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deep_domain_search }}" != "true" ]; then
            DEEP_ARG=""
          fi
          python -m app.company_enrichment_runner \
            --source-config data/job_sources.json \
            --domain-budget "${{ inputs.domain_budget || '750' }}" \
            --career-budget "${{ inputs.career_budget || '750' }}" \
            --ats-tenant-budget "${{ inputs.ats_tenant_budget || '250' }}" \
            --retry-days 1 \
            $DEEP_ARG | tee employer-universe-enrichment.log

      - name: Publish employer-universe metrics
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "## Employer Universe Enrichment" >> "$GITHUB_STEP_SUMMARY"
          grep '^EMPLOYER_UNIVERSE ' employer-universe-enrichment.log >> "$GITHUB_STEP_SUMMARY" || {
            echo "EMPLOYER_UNIVERSE metrics were not emitted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Record successful enrichment handoff
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          log = Path("employer-universe-enrichment.log").read_text(encoding="utf-8", errors="replace").splitlines()
          metric_lines = [line for line in log if line.startswith("EMPLOYER_UNIVERSE ")]
          if not metric_lines:
              raise SystemExit("Cannot mark enrichment successful without EMPLOYER_UNIVERSE metrics")
          state = Path("state")
          state.mkdir(parents=True, exist_ok=True)
          completed = datetime.now(timezone.utc)
          marker = {
              "status": "SUCCESS",
              "completed_at": completed.isoformat(),
              "eastern_date": completed.astimezone(ZoneInfo("America/New_York")).date().isoformat(),
              "workflow_run_id": "${{ github.run_id }}",
              "metrics": metric_lines[-1].removeprefix("EMPLOYER_UNIVERSE ").strip(),
          }
          (state / "employer_universe_last_success.json").write_text(json.dumps(marker, indent=2), encoding="utf-8")
          print(json.dumps(marker, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          name: employer-universe-${{ github.run_number }}
          path: |
            employer-universe-enrichment.log
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
