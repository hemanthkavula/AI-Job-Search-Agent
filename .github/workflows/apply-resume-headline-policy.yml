name: Apply Resume Headline Policy

on:
  push:
    paths:
      - .github/apply-resume-headline-policy.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply headline policy
        run: python scripts/apply_resume_headline_policy.py

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run headline and resume regression tests
        run: PYTHONPATH=. pytest -q tests/test_resume_headline_policy.py tests/test_fresh_master_resume_contract.py tests/test_resume_nonblocking_quality.py

      - name: Commit permanent headline policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/reference_resume_formatter.py tests/test_resume_headline_policy.py
          git commit -m "Keep resume headline truthful and JD aligned"
          git push origin HEAD:main
