name: Apply Production Follow-up Fixes

on:
  push:
    branches:
      - fix/production-verification-followups-20261003

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-verification-followups-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair embedded regression-test literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_production_followup_fixes.py')
          text=p.read_text(encoding='utf-8')
          bad="""lambda url:'''<html><script type=\"application/ld+json\">{\"@type\":\"JobPosting\",\"datePosted\":\"2026-10-01T12:00:00Z\"}</script></html>'''"""
          good="""lambda url:'<html><script type=\"application/ld+json\">{\"@type\":\"JobPosting\",\"datePosted\":\"2026-10-01T12:00:00Z\"}</script></html>'"""
          if bad in text:
              p.write_text(text.replace(bad,good),encoding='utf-8')
          PY
      - name: Apply fixes
        run: python scripts/apply_production_followup_fixes.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run targeted regressions
        run: |
          python -m pytest -q \
            tests/test_rejection_reason_reporting.py \
            tests/test_source_unhealthy_retry.py \
            tests/test_updated_at_fallback_finalizer.py \
            tests/test_freshness_exact_cutoff.py \
            tests/test_official_posting_freshness.py \
            tests/test_daily_runner_provider_status.py \
            tests/test_source_error_observability.py
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/discovery.py app/daily_runner.py app/jd_finalizer.py tests/test_rejection_reason_reporting.py tests/test_source_unhealthy_retry.py tests/test_updated_at_fallback_finalizer.py scripts/apply_production_followup_fixes.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix source retries, rejection reporting, and freshness authority'
          git push origin HEAD:fix/production-verification-followups-20261003
