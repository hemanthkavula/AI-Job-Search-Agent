name: Master Resume 2026-10-03 Validation

on:
  push:
    branches: [master-resume-20261003]
    paths:
      - "scripts/apply_master_resume_20261003.py"
      - ".github/workflows/master-resume-20261003-validation.yml"

permissions:
  contents: write

concurrency:
  group: master-resume-20261003-validation
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply uploaded master resume baseline
        run: python scripts/apply_master_resume_20261003.py
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run targeted master-resume tests
        run: python -m pytest -q tests/test_master_resume_20261003.py tests/test_reference_resume_formatter_layout.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Commit validated production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app data tests
          git status --short
          git commit -m "Use Oct 3 master resume style and content baseline"
          git push origin HEAD:master-resume-20261003
