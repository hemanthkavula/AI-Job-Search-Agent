name: ATS Adapter Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "app/sources/smartrecruiters.py"
      - "app/sources/workable.py"
      - "app/sources/ukg.py"
      - "app/sources/career_site.py"
      - "data/job_sources.json"
      - ".github/workflows/ats-adapter-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SmartRecruiters and Workable live smoke
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          from urllib.parse import urlsplit, urljoin, unquote
          from app.sources.career_site import _get, _jobpostings
          from app.sources.smartrecruiters import fetch_jobs as smartrecruiters_jobs
          from app.sources.workable import fetch_jobs as workable_jobs
          from app.sources.ukg import fetch_jobs as ukg_jobs, _get as ukg_get, _jobposting as ukg_jobposting
          from app.sources.dayforce import fetch_jobs as dayforce_jobs, _get as dayforce_get, _posts as dayforce_posts

          cfg=json.loads(Path("data/job_sources.json").read_text(encoding="utf-8"))
          totals={"smartrecruiters":0,"workable":0,"ukg":0}
          failures=[]

          for src in cfg.get("smartrecruiters",[]):
              company=src.get("company") or src.get("company_identifier")
              ident=src.get("company_identifier")
              try:
                  jobs=smartrecruiters_jobs(ident,timeout=20,hours=168)
                  totals["smartrecruiters"] += len(jobs)
                  print(f"SMOKE smartrecruiters | {company} | {ident} | {len(jobs)} DE jobs",flush=True)
              except Exception as exc:
                  failures.append(("smartrecruiters",company,str(exc)))
                  print(f"SMOKE smartrecruiters | {company} | ERROR | {exc}",flush=True)

          for src in cfg.get("workable",[]):
              company=src.get("company") or src.get("search_url")
              url=src.get("search_url")
              try:
                  slug=urlsplit(url).path.strip("/").split("/")[0]
                  api_url=f"https://www.workable.com/api/accounts/{slug}?details=true"
                  api_body=_get(api_url,25)
                  api_payload=json.loads(api_body)
                  api_jobs=api_payload.get("jobs") if isinstance(api_payload,dict) else None
                  board=_get(url,25)
                  ordinary=len(re.findall(r'href=[\\\'"][^\\\'"]*/j/[^\\\'"]+[\\\'"]',board,re.I))
                  embedded=len(re.findall(r'(?:/j/|%2Fj%2F)([A-Za-z0-9]{6,})',board,re.I))
                  jsonld=len(_jobpostings(board))
                  keys=sorted(api_payload.keys())[:30] if isinstance(api_payload,dict) else []
                  sample_keys=sorted(api_jobs[0].keys()) if isinstance(api_jobs,list) and api_jobs and isinstance(api_jobs[0],dict) else []
                  sample_types={k:type(api_jobs[0].get(k)).__name__ for k in sample_keys} if sample_keys else {}
                  print(f"DIAG workable | {company} | api_bytes={len(api_body)} api_keys={keys} api_jobs={len(api_jobs) if isinstance(api_jobs,list) else 'NA'} board_bytes={len(board)} jsonld={jsonld} anchors={ordinary} embedded_ids={embedded}",flush=True)
                  print(f"DIAG workable shape | {company} | job_keys={sample_keys} job_types={sample_types}",flush=True)
                  jobs=workable_jobs(company,url,timeout=25)
                  totals["workable"] += len(jobs)
                  print(f"SMOKE workable | {company} | {len(jobs)} DE jobs",flush=True)
              except Exception as exc:
                  failures.append(("workable",company,str(exc)))
                  print(f"SMOKE workable | {company} | ERROR | {exc}",flush=True)

          for src in cfg.get("dayforce",[]):
              company=src.get("company") or src.get("search_url"); url=src.get("search_url")
              try:
                  body=dayforce_get(url,25)
                  posts=dayforce_posts(body)
                  hrefs=re.findall(r'href=["\\\']([^"\\\']+)["\\\']',body,re.I)
                  joblinks=[urljoin(url,html.unescape(h)) for h in hrefs if any(x in h.lower() for x in ("/job/","/jobs/","jobdetail","job-details","posting"))]
                  scripts=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body,re.I)
                  hints=sorted(set(x for x in re.findall(r'(?i)(?:https?:)?//[^"\\\'<> ]+|/[A-Za-z0-9_.?=&%/-]{3,}',body) if any(k in x.lower() for k in ("api","job","career","posting","candidate"))))[:80]
                  next_data=[]
                  for raw in re.findall(r'<script[^>]+id=["\\\']__NEXT_DATA__["\\\'][^>]*>(.*?)</script>',body,re.I|re.S):
                      try:
                          nd=json.loads(html.unescape(raw.strip()))
                          next_data.append(nd)
                      except Exception: pass
                  bundle_hints=[]
                  for src in scripts:
                      if "[clientNamespace]" in src or "careerSiteXRefCode" in src or "%5BclientNamespace%5D" in src:
                          try:
                              js=dayforce_get(urljoin(url,src),25)
                              for token in ("api/","job","posting","search","careerSite","CandidatePortal"):
                                  start=0
                                  while len(bundle_hints)<20:
                                      pos=js.lower().find(token.lower(),start)
                                      if pos<0: break
                                      bundle_hints.append(js[max(0,pos-1800):pos+3000].replace("\\n"," ")[:4800])
                                      start=pos+len(token)
                          except Exception as exc:
                              bundle_hints.append("BUNDLE_ERROR:"+type(exc).__name__)
                  print(f"DIAG dayforce next | {company} | next_data={next_data[:1]} bundle_snippets={bundle_hints[:8]}",flush=True)
                  # Inspect compact Next.js dehydrated query metadata and discover API-shaped strings.
                  next_summary=[]
                  api_strings=[]
                  if next_data:
                      nd=next_data[0]
                      pp=(nd.get("props") or {}).get("pageProps") or {}
                      dq=((pp.get("dehydratedState") or {}).get("queries") or [])
                      for q in dq:
                          qk=q.get("queryKey")
                          data=((q.get("state") or {}).get("data"))
                          if isinstance(data,dict):
                              next_summary.append({"queryKey":qk,"data_keys":sorted(data.keys())[:60],"sample":{k:data.get(k) for k in ("clientNamespace","careerSiteXRefCode","language","clientId","jobBoardId","id") if k in data}})
                      def walk(v):
                          if isinstance(v,dict):
                              for k,x in v.items():
                                  if isinstance(x,str) and any(t in x.lower() for t in ("/api/","search-jobs","job-post","jobs.dayforce","candidateportal")):
                                      api_strings.append(x[:1000])
                                  walk(x)
                          elif isinstance(v,list):
                              for x in v: walk(x)
                      walk(nd)
                  print(f"DIAG dayforce model | {company} | queries={next_summary[:20]} strings={sorted(set(api_strings))[:40]}",flush=True)
                  # Trace search contract from the active Dayforce page bundle.
                  contract=[]
                  for src in scripts:
                      if "%5BclientNamespace%5D" not in src: continue
                      try:
                          js=dayforce_get(urljoin(url,src),25)
                          for token in ("job-search","jobSearch","searchJobs","job-postings","jobPostings","posting-search","search-results","site-info"):
                              start=0
                              while len(contract)<40:
                                  pos=js.lower().find(token.lower(),start)
                                  if pos<0: break
                                  contract.append(js[max(0,pos-1200):pos+2200].replace("\n"," ")[:3400])
                                  start=pos+len(token)
                      except Exception as exc:
                          contract.append("ERROR:"+type(exc).__name__)
                  print(f"DIAG dayforce contract | {company} | snippets={contract[:20]}",flush=True)
                  # Probe Next.js server-data routes using confirmed build/tenant metadata.
                  from urllib.request import Request as DayforceProbeRequest, urlopen as dayforce_probe_open
                  server_probes=[]
                  if next_data:
                      nd=next_data[0]
                      build=nd.get("buildId")
                      q=nd.get("query") or {}
                      ns=q.get("clientNamespace") or "clearcaptions"
                      cs=q.get("careerSiteXRefCode") or "CANDIDATEPORTAL"
                      base="https://jobs.dayforcehcm.com"
                      paths=[
                          f"/_next/data/{build}/en-US/{ns}/{cs}.json",
                          f"/_next/data/{build}/{ns}/{cs}.json",
                          f"/api/{ns}/{cs}/jobs",
                          f"/api/jobs?clientNamespace={ns}&careerSiteXRefCode={cs}&language=en-US",
                          f"/api/job-postings?clientNamespace={ns}&careerSiteXRefCode={cs}&language=en-US",
                      ]
                      for p in paths:
                          try:
                              req=DayforceProbeRequest(base+p,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/plain,*/*","Referer":url})
                              with dayforce_probe_open(req,timeout=20) as resp:
                                  raw=resp.read(20000).decode("utf-8","replace")
                                  server_probes.append({"path":p,"status":resp.status,"type":resp.headers.get("Content-Type",""),"bytes":len(raw),"head":raw[:1200].replace("\n"," ")})
                          except Exception as exc:
                              server_probes.append({"path":p,"error":type(exc).__name__+":"+str(exc)[:200]})
                  print(f"DIAG dayforce server | {company} | probes={server_probes}",flush=True)
                  # Inspect successful Next.js JSON structurally without dumping translations.
                  server_model=[]
                  for probe_path in paths[:2]:
                      try:
                          req=DayforceProbeRequest(base+probe_path,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":url})
                          with dayforce_probe_open(req,timeout=20) as resp:
                              obj=json.loads(resp.read().decode("utf-8","replace"))
                          pp=obj.get("pageProps") or {}
                          dq=((pp.get("dehydratedState") or {}).get("queries") or [])
                          qsum=[]
                          for item in dq:
                              st=item.get("state") or {}; dat=st.get("data")
                              qsum.append({"queryKey":item.get("queryKey"),"data_keys":sorted(dat.keys()) if isinstance(dat,dict) else type(dat).__name__})
                          strings=[]
                          def walk2(x):
                              if isinstance(x,dict):
                                  for k,v in x.items():
                                      if any(t in str(k).lower() for t in ("job","search","api","posting","career","route")): strings.append("KEY:"+str(k))
                                      walk2(v)
                              elif isinstance(x,list):
                                  for v in x: walk2(v)
                              elif isinstance(x,str) and any(t in x.lower() for t in ("/api/","job-post","search-job","search job","career","posting")):
                                  strings.append(x[:500])
                          walk2(pp)
                          server_model.append({"path":probe_path,"pageProps_keys":sorted(pp.keys()),"queries":qsum[:20],"strings":sorted(set(strings))[:80]})
                      except Exception as exc:
                          server_model.append({"path":probe_path,"error":type(exc).__name__+":"+str(exc)[:200]})
                  print(f"DIAG dayforce server-model | {company} | {server_model}",flush=True)
                  # Read Next.js manifests to identify the exact page chunks that issue client-side job searches.
                  manifest_results=[]
                  if next_data:
                      build=next_data[0].get("buildId")
                      for mp in (f"/_next/static/{build}/_buildManifest.js",f"/_next/static/{build}/_ssgManifest.js"):
                          try:
                              req=DayforceProbeRequest(base+mp,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*","Referer":url})
                              with dayforce_probe_open(req,timeout=20) as resp:
                                  raw=resp.read(200000).decode("utf-8","replace")
                              chunks=sorted(set(re.findall(r'[^"\\\']+\\.js',raw)))
                              relevant=[x for x in chunks if any(k in x.lower() for k in ("clientnamespace","career","candidate","job"))]
                              manifest_results.append({"path":mp,"status":resp.status,"bytes":len(raw),"relevant":relevant[:80],"chunks":chunks[:120]})
                          except Exception as exc:
                              manifest_results.append({"path":mp,"error":type(exc).__name__+":"+str(exc)[:200]})
                  print(f"DIAG dayforce manifests | {company} | {manifest_results}",flush=True)
                  # Follow concrete Dayforce Go?item references exposed by the rendered career page.
                  decoded_body=html.unescape(unquote(body))
                  go_refs=sorted(set(html.unescape(x).replace("&amp;","&") for x in re.findall(r'https://[^"\\\'<> ]+/CandidatePortal/[^"\\\'<> ]+/Go\\?item=[0-9a-fA-F-]{36}',decoded_body,re.I)))
                  go_results=[]
                  for gu in go_refs[:10]:
                      try:
                          req=DayforceProbeRequest(gu,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*","Referer":url})
                          with urlopen(req,timeout=25) as resp:
                              final_url=resp.geturl(); gb=resp.read().decode("utf-8","replace")
                              go_results.append({"source":gu,"final":final_url,"status":resp.status,"bytes":len(gb),"jsonld":len(dayforce_posts(gb)),"title":re.findall(r'<title[^>]*>(.*?)</title>',gb,re.I|re.S)[:1],"hints":sorted(set(x for x in re.findall(r'(?i)(?:https?:)?//[^"\\\'<> ]+|/[A-Za-z0-9_.?=&%/-]{3,}',gb) if any(k in x.lower() for k in ("api","job","career","posting","candidate"))))[:40]})
                      except Exception as exc:
                          go_results.append({"source":gu,"error":type(exc).__name__+":"+str(exc)[:300]})
                  print(f"DIAG dayforce go | {company} | refs={go_refs[:10]} results={go_results}",flush=True)
                  jobs=dayforce_jobs(company,url,timeout=25)
                  print(f"DIAG dayforce | {company} | bytes={len(body)} jsonld={len(posts)} joblinks={len(joblinks)} scripts={scripts[:30]}",flush=True)
                  print(f"DIAG dayforce hints | {company} | {hints}",flush=True)
                  print(f"SMOKE dayforce | {company} | {len(jobs)} DE jobs",flush=True)
              except Exception as exc:
                  failures.append(("dayforce",company,str(exc)))
                  print(f"SMOKE dayforce | {company} | ERROR | {exc}",flush=True)

          seen_ukg=set()
          for family in ("ukg","ultipro","ultipro_ukg"):
              for src in cfg.get(family,[]):
                  company=src.get("company") or src.get("search_url")
                  url=src.get("search_url")
                  duplicate=url in seen_ukg
                  seen_ukg.add(url)
                  try:
                      body=ukg_get(url,25)
                      jsonld=len(ukg_jobposting(body))
                      inline_hints=[]
                      for token in ("LoadSearchResults","GetOpportunityMatchCount","OpportunityDetail","JobBoardView"):
                          start=0
                          while len(inline_hints)<12:
                              pos=body.find(token,start)
                              if pos<0: break
                              inline_hints.append(body[max(0,pos-1800):pos+2600].replace("\\n"," ")[:4400])
                              start=pos+len(token)
                      endpoint_hints=sorted(set(re.findall(r'(?i)(?:https?:)?//[^"\\\'<> ]+|/[A-Za-z0-9_.?=&%/-]{3,}',body)))
                      endpoint_hints=[x for x in endpoint_hints if any(k in x.lower() for k in ("api","jobboard","opportunit","recruit","posting","search"))][:40]
                      script_srcs=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body,re.I)[:40]
                      js_hints=[]
                      bundle_urls=[urljoin(url,x) for x in script_srcs if any(k in x.lower() for k in ("sitebundle","site.min","site.js","jslib"))]
                      for full_script in bundle_urls:
                          try:
                              script_body=ukg_get(full_script,25)
                              for token in ("LoadSearchResults","GetOpportunityMatchCount"):
                                  start=0
                                  while len(js_hints)<12:
                                      pos=script_body.find(token,start)
                                      if pos<0: break
                                      js_hints.append(script_body[max(0,pos-3000):pos+5000].replace("\\n"," ")[:8000])
                                      start=pos+len(token)
                          except Exception as exc:
                              js_hints.append("BUNDLE_ERROR:"+type(exc).__name__)
                      visible=len(re.findall(r'href=["\\\'][^"\\\']*(?:OpportunityDetail|/job/|/jobs/)[^"\\\']*["\\\']',body,re.I))
                      from urllib.request import Request as ProbeRequest, urlopen as probe_open
                      from urllib.error import HTTPError
                      probe_url=urljoin(url.rstrip("/")+"/","JobBoardView/LoadSearchResults")
                      probes=[("GET",None,None),("POST_FORM",b"page=1&pageSize=20","application/x-www-form-urlencoded"),("POST_JSON",b'{"page":1,"pageSize":20}',"application/json"),("POST_EMPTY",b"","application/x-www-form-urlencoded")]
                      probe_results=[]
                      for pname,pdata,pctype in probes:
                          try:
                              headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html,*/*","Referer":url}
                              if pctype: headers["Content-Type"]=pctype
                              req=ProbeRequest(probe_url,data=pdata,headers=headers,method="GET" if pdata is None else "POST")
                              with probe_open(req,timeout=20) as resp:
                                  raw=resp.read(12000).decode("utf-8","replace")
                                  probe_results.append((pname,resp.status,resp.headers.get("Content-Type",""),len(raw),raw[:1500].replace("\\n"," ")))
                          except HTTPError as exc:
                              raw=exc.read(4000).decode("utf-8","replace")
                              probe_results.append((pname,exc.code,exc.headers.get("Content-Type",""),len(raw),raw[:1000].replace("\\n"," ")))
                          except Exception as exc:
                              probe_results.append((pname,"ERR",type(exc).__name__,0,str(exc)[:500]))
                      print(f"DIAG UKG probe | {company} | {probe_results}",flush=True)
                      jobs=ukg_jobs(company,url,timeout=25)
                      totals["ukg"] += len(jobs)
                      print(f"DIAG {family} | {company} | duplicate={duplicate} board_bytes={len(body)} jsonld={jsonld} visible_job_links={visible}",flush=True)
                      print(f"DIAG UKG hints | {company} | endpoints={endpoint_hints} scripts={script_srcs}",flush=True)
                      print(f"DIAG UKG inline | {company} | snippets={inline_hints[:6]}",flush=True)
                      model_keys=sorted(set(re.findall(r'["\\\']([A-Za-z][A-Za-z0-9_]{2,50})["\\\']\\s*:',body)))
                      guid_context=[]
                      for gm in re.finditer(r'[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}',body):
                          ctx=body[max(0,gm.start()-500):gm.end()+800]
                          if any(k.lower() in ctx.lower() for k in ("opportunity","title","description","job")):
                              guid_context.append(ctx.replace("\\n"," ")[:1400])
                          if len(guid_context)>=8: break
                      print(f"DIAG UKG model | {company} | keys={model_keys[:120]} guid_context={guid_context}",flush=True)
                      print(f"DIAG UKG request | {company} | snippets={js_hints[:3]}",flush=True)
                      print(f"SMOKE {family} | {company} | {len(jobs)} DE jobs",flush=True)
                  except Exception as exc:
                      failures.append((family,company,str(exc)))
                      print(f"SMOKE {family} | {company} | ERROR | {exc}",flush=True)

          print(f"SMOKE TOTAL smartrecruiters={totals['smartrecruiters']} workable={totals['workable']} ukg={totals['ukg']} failures={len(failures)}",flush=True)
          if failures:
              raise SystemExit("ATS smoke had execution failures")
          PY
