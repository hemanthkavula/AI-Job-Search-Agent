name: ATS Adapter Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "app/sources/smartrecruiters.py"
      - "app/sources/workable.py"
      - "app/sources/ukg.py"
      - "app/sources/career_site.py"
      - "data/job_sources.json"
      - ".github/workflows/ats-adapter-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SmartRecruiters and Workable live smoke
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urlsplit, urljoin
          from app.sources.career_site import _get, _jobpostings
          from app.sources.smartrecruiters import fetch_jobs as smartrecruiters_jobs
          from app.sources.workable import fetch_jobs as workable_jobs
          from app.sources.ukg import fetch_jobs as ukg_jobs, _get as ukg_get, _jobposting as ukg_jobposting

          cfg=json.loads(Path("data/job_sources.json").read_text(encoding="utf-8"))
          totals={"smartrecruiters":0,"workable":0,"ukg":0}
          failures=[]

          for src in cfg.get("smartrecruiters",[]):
              company=src.get("company") or src.get("company_identifier")
              ident=src.get("company_identifier")
              try:
                  jobs=smartrecruiters_jobs(ident,timeout=20,hours=168)
                  totals["smartrecruiters"] += len(jobs)
                  print(f"SMOKE smartrecruiters | {company} | {ident} | {len(jobs)} DE jobs",flush=True)
              except Exception as exc:
                  failures.append(("smartrecruiters",company,str(exc)))
                  print(f"SMOKE smartrecruiters | {company} | ERROR | {exc}",flush=True)

          for src in cfg.get("workable",[]):
              company=src.get("company") or src.get("search_url")
              url=src.get("search_url")
              try:
                  slug=urlsplit(url).path.strip("/").split("/")[0]
                  api_url=f"https://www.workable.com/api/accounts/{slug}?details=true"
                  api_body=_get(api_url,25)
                  api_payload=json.loads(api_body)
                  api_jobs=api_payload.get("jobs") if isinstance(api_payload,dict) else None
                  board=_get(url,25)
                  ordinary=len(re.findall(r'href=[\\\'"][^\\\'"]*/j/[^\\\'"]+[\\\'"]',board,re.I))
                  embedded=len(re.findall(r'(?:/j/|%2Fj%2F)([A-Za-z0-9]{6,})',board,re.I))
                  jsonld=len(_jobpostings(board))
                  keys=sorted(api_payload.keys())[:30] if isinstance(api_payload,dict) else []
                  sample_keys=sorted(api_jobs[0].keys()) if isinstance(api_jobs,list) and api_jobs and isinstance(api_jobs[0],dict) else []
                  sample_types={k:type(api_jobs[0].get(k)).__name__ for k in sample_keys} if sample_keys else {}
                  print(f"DIAG workable | {company} | api_bytes={len(api_body)} api_keys={keys} api_jobs={len(api_jobs) if isinstance(api_jobs,list) else 'NA'} board_bytes={len(board)} jsonld={jsonld} anchors={ordinary} embedded_ids={embedded}",flush=True)
                  print(f"DIAG workable shape | {company} | job_keys={sample_keys} job_types={sample_types}",flush=True)
                  jobs=workable_jobs(company,url,timeout=25)
                  totals["workable"] += len(jobs)
                  print(f"SMOKE workable | {company} | {len(jobs)} DE jobs",flush=True)
              except Exception as exc:
                  failures.append(("workable",company,str(exc)))
                  print(f"SMOKE workable | {company} | ERROR | {exc}",flush=True)

          seen_ukg=set()
          for family in ("ukg","ultipro","ultipro_ukg"):
              for src in cfg.get(family,[]):
                  company=src.get("company") or src.get("search_url")
                  url=src.get("search_url")
                  duplicate=url in seen_ukg
                  seen_ukg.add(url)
                  try:
                      body=ukg_get(url,25)
                      jsonld=len(ukg_jobposting(body))
                      inline_hints=[]
                      for token in ("LoadSearchResults","GetOpportunityMatchCount","OpportunityDetail","JobBoardView"):
                          start=0
                          while len(inline_hints)<12:
                              pos=body.find(token,start)
                              if pos<0: break
                              inline_hints.append(body[max(0,pos-1800):pos+2600].replace("\\n"," ")[:4400])
                              start=pos+len(token)
                      endpoint_hints=sorted(set(re.findall(r'(?i)(?:https?:)?//[^"\\\'<> ]+|/[A-Za-z0-9_.?=&%/-]{3,}',body)))
                      endpoint_hints=[x for x in endpoint_hints if any(k in x.lower() for k in ("api","jobboard","opportunit","recruit","posting","search"))][:40]
                      script_srcs=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body,re.I)[:40]
                      js_hints=[]
                      for script_url in script_srcs:
                          try:
                              script_body=ukg_get(urljoin(url,script_url),25)
                              if "LoadSearchResults" in script_body:
                                  pos=script_body.find("LoadSearchResults")
                                  js_hints.append(script_body[max(0,pos-1200):pos+2200].replace("\\n"," ")[:3400])
                          except Exception:
                              pass
                      visible=len(re.findall(r'href=["\\\'][^"\\\']*(?:OpportunityDetail|/job/|/jobs/)[^"\\\']*["\\\']',body,re.I))
                      jobs=ukg_jobs(company,url,timeout=25)
                      totals["ukg"] += len(jobs)
                      print(f"DIAG {family} | {company} | duplicate={duplicate} board_bytes={len(body)} jsonld={jsonld} visible_job_links={visible}",flush=True)
                      print(f"DIAG UKG hints | {company} | endpoints={endpoint_hints} scripts={script_srcs}",flush=True)
                      print(f"DIAG UKG inline | {company} | snippets={inline_hints[:6]}",flush=True)
                      model_keys=sorted(set(re.findall(r'["\\\']([A-Za-z][A-Za-z0-9_]{2,50})["\\\']\\s*:',body)))
                      guid_context=[]
                      for gm in re.finditer(r'[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}',body):
                          ctx=body[max(0,gm.start()-500):gm.end()+800]
                          if any(k.lower() in ctx.lower() for k in ("opportunity","title","description","job")):
                              guid_context.append(ctx.replace("\\n"," ")[:1400])
                          if len(guid_context)>=8: break
                      print(f"DIAG UKG model | {company} | keys={model_keys[:120]} guid_context={guid_context}",flush=True)
                      print(f"DIAG UKG request | {company} | snippets={js_hints[:3]}",flush=True)
                      print(f"SMOKE {family} | {company} | {len(jobs)} DE jobs",flush=True)
                  except Exception as exc:
                      failures.append((family,company,str(exc)))
                      print(f"SMOKE {family} | {company} | ERROR | {exc}",flush=True)

          print(f"SMOKE TOTAL smartrecruiters={totals['smartrecruiters']} workable={totals['workable']} ukg={totals['ukg']} failures={len(failures)}",flush=True)
          if failures:
              raise SystemExit("ATS smoke had execution failures")
          PY
