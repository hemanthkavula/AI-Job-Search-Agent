name: One-Time Controlled Production Test

on:
  push:
    branches:
      - run-one-controlled-test
    paths:
      - .github/workflows/one-time-production-test.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-one-test:
    if: github.event.head_commit.message == 'Trigger one controlled production test'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one forced production cycle with one-application cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/daily-discovery.yml/dispatches" \
            -d '{"ref":"main","inputs":{"force":"true","application_limit":"1"}}'
          echo "Dispatched daily-discovery.yml with force=true and application_limit=1"
