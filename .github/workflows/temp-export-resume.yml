name: temp-export-resume
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: st-lukes-resume
          path: tmp/Hemanth_Kavula_St_Lukes_Data_Engineer_Resume.pdf
          if-no-files-found: error
